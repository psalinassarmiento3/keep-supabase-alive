name: Grupocasal Health ML (cada 10 min)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar salud ML
        run: |
          echo "=== Sincronizando salud ML grupocasal ==="
          curl -sf --max-time 240 "https://grupocasal-eta.vercel.app/api/mercadolibre/health-sync?key=${{ secrets.ML_CRON_KEY }}" || echo "FALLO (se reintenta en 10 min)"
