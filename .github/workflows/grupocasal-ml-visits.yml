name: Grupocasal ML Visits (cada hora)

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refrescar ml_item_stats
        run: |
          echo "=== Refrescando visitas ML grupocasal ==="
          curl -sf --max-time 240 "https://grupocasal-eta.vercel.app/api/cron/ml-visits?key=${{ secrets.ML_CRON_KEY }}" || echo "FALLO (se reintenta la proxima hora)"
